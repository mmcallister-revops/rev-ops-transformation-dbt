name: revops_models
version: '1.0.0'
profile: revops

model-paths:    ["models"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
test-paths:     ["tests"]
analysis-paths: ["analyses"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

vars:
  product_logic_version: "product_conform_v1"

models:
  revops_models:

    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    gold:
      +materialized: table
      +schema: gold
      common:
        +tags: ["gold", "common"]
