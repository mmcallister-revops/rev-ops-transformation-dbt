version: 1

models:

  - name: dim_vartopia_deal_registration
    description: >
      Gold dimension table for Vartopia deal registrations.
      Deduplicates on vartopia_sf_registration_id, filters deleted records,
      and resolves first/last name pairs into display name columns.
      migrated_to_vartopia and is_native_vartopia_registration flags
      are passed through from stg_vartopia_deal_registration.
    columns:
      - name: vartopia_registration_id
        description: Salesforce record ID. Primary key of this model.
        tests:
          - not_null
          - unique
      - name: opportunity_id
        description: Linked Salesforce Opportunity ID. May be NULL.
      - name: migrated_to_vartopia
        description: >
          TRUE = has a matching legacy deal registration (pre-rollout record).
          FALSE = native post-June 2024 Vartopia registration.
        tests:
          - not_null
      - name: is_native_vartopia_registration
        description: >
          TRUE = genuine post-June 2024 Vartopia registration; no legacy deal registration exists.
          FALSE = migrated from legacy deal registration object.
        tests:
          - not_null
      - name: submitter_name
        description: >
          Resolved display name for the submitter.
          Derived from submitted_by_first_name + submitted_by_last_name,
          falling back to deal_registration_name when either part is blank.
      - name: primary_salesrep_name
        description: >
          Resolved display name for the primary sales rep.
          NULL when both first and last name are blank.
      - name: partner_se_name
        description: Resolved display name for the partner SE.
      - name: customer_contact_name
        description: Resolved display name for the customer contact.
      - name: edp_updated_at
        description: Timestamp when this record was last written by dbt.
        tests:
          - not_null

  - name: dim_opportunity
    description: >
      Gold dimension for Salesforce Opportunities (current SCD2 version only).
      Enriched with owner attributes from dim_user, stage group mapping,
      close date history metrics, and BVA task coverage flags.
    columns:
      - name: opportunity_id
        description: Salesforce Opportunity ID. Primary key.
        tests:
          - not_null
          - unique
      - name: is_current
        description: Always TRUE in this model — filtered to current SCD2 row in WHERE clause.
      - name: closed_lost_exclusion_flag
        description: >
          TRUE when a Closed Lost opp is excluded from reporting
          (duplicate, unqualified, or pre-qualify stage at close).
      - name: revops_reporting_exclusion_flag
        description: >
          TRUE when win/loss reason indicates co-term or duplicate —
          excluded from RevOps pipeline reporting.
      - name: has_bva_task_without_bva_record
        description: BVA QA flag — task logged but no value proposition record found.
      - name: migrated_to_vartopia
        description: >
          Not present in this model — see dim_vartopia_deal_registration
          for the Vartopia classification flags.

  - name: dim_user
    description: >
      Gold dimension for Salesforce Users with manager chain (up to 7 levels),
      role/profile lookups, and is_infoblox_employee domain flag.
    columns:
      - name: user_id
        description: Salesforce User ID. Primary key.
        tests:
          - not_null
          - unique
      - name: user_name
        description: >
          Resolved display name: first_name + last_name when both present,
          fallback to raw name field.
      - name: is_infoblox_employee
        description: TRUE when email domain is @infoblox.com.
        tests:
          - not_null

  - name: dim_product
    description: >
      Gold dimension for Salesforce Product2 with derived revenue category,
      ACV/nACV eligibility flags, and selling model lookup.
    columns:
      - name: product2_id
        description: Salesforce Product2 ID. Primary key.
        tests:
          - not_null
          - unique
      - name: product_sk
        description: Surrogate key generated by dbt_utils.generate_surrogate_key.
        tests:
          - not_null
          - unique
      - name: acv_eligible_flag
        description: TRUE for product categories that contribute to ACV.
      - name: nacv_pricing_eligible_flag
        description: TRUE for subscription/annual pricing eligible products.

  - name: dim_quote_unified
    description: >
      Gold dimension for quote headers, unioning RCA (legacy) and CPQ (Salesforce CPQ)
      sources. One row per quote per source system.
    columns:
      - name: quote_unified_sk
        description: Surrogate key on source_system + quote_id.
        tests:
          - not_null
          - unique
      - name: quote_id
        description: Quote ID from the source system.
        tests:
          - not_null
      - name: source_system
        description: "'RCA' or 'CPQ'."
        tests:
          - not_null
          - accepted_values:
              values: ['RCA', 'CPQ']

  - name: fct_quote_unified
    description: >
      Gold fact for quote-level financials, unioning RCA and CPQ sources.
      One row per quote per source system. ACV and renewal metrics included.
    columns:
      - name: quote_unified_sk
        description: Surrogate key on source_system + quote_id.
        tests:
          - not_null
          - unique
      - name: source_system
        description: "'RCA' or 'CPQ'."
        tests:
          - not_null
          - accepted_values:
              values: ['RCA', 'CPQ']

  - name: dim_user
    description: >
      Gold dimension for Salesforce Users with manager chain (up to 7 levels),
      role and profile lookups, and is_infoblox_employee domain check.
    columns:
      - name: user_id
        description: Salesforce User ID. Primary key.
        tests:
          - not_null
          - unique
      - name: user_name
        description: >
          Resolved display name. INITCAP(first_name) + INITCAP(last_name)
          when both present; falls back to INITCAP(name).
      - name: is_infoblox_employee
        description: TRUE when email domain is @infoblox.com.
        tests:
          - not_null
      - name: is_active
        description: TRUE if the Salesforce user account is active.
      - name: manager_chain_depth
        description: Number of manager levels above this user (0 = no manager, max 7).
      - name: edp_updated_at
        description: Timestamp when this record was last written by dbt.
        tests:
          - not_null
