version: 2

models:
  - name: dim_product
    description: "Gold dimension for Salesforce Product2 with derived revenue category,
      ACV/nACV eligibility flags, and selling model lookup."
    config:
      tags: ["gold", "common", "salesforce", "dimension"]
    meta:
      # owner: "To be confirmed - DGC"
      # steward: "To be confirmed - DGC"
      # domain: "Sales"
      source_systems: >
        Salesforce CRM (bronze_salesforce.product2;
        bronze_salesforce.productsellingmodel;
        bronze_salesforce.productsellingmodeloption)
      refresh_cadence: "Daily"

    columns:
      - name: product2_id
        description: "Salesforce Product2 ID. Primary key."
        tests:
          - not_null
          - unique

      - name: product_sk
        description: "Surrogate key generated by dbt_utils.generate_surrogate_key."
        tests:
          - not_null
          - unique

      - name: acv_eligible_flag
        description: "TRUE for product categories that contribute to ACV."

      - name: nacv_pricing_eligible_flag
        description: "TRUE for subscription/annual pricing eligible products."